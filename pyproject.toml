# Tool configuration only — IPNova is run as scripts, not installed as a package.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["output"]

[tool.ruff.lint]
# Ruff's stable defaults (pyflakes + pycodestyle E4/E7/E9) plus W6 (invalid
# escape sequences). Kept conservative so CI lint stays green on upgrades.
select = ["E4", "E7", "E9", "F", "W6"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
